[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gitlib"
version = "0.1.0"
description = "Local-first CLI for managing Git repositories."
requires-python = ">=3.13"
dependencies = [
    "textual>=0.61,<1.0",
]

[project.scripts]
gitlib = "gitlib.cli:main"
